name: Auto Build & Release

# 배포 채널
#   - 작업 브랜치(claude/**)에 push → 테스트 채널: 고정 태그 'test' 프리릴리즈에 덮어 올린다.
#     앱 설정에서 '테스트 버전 받기'를 켠 PC만 이걸로 업데이트된다(정식 'latest'는 그대로).
#   - main에 push, 또는 Actions에서 수동 실행(channel=stable) → 정식 채널: 새 버전 릴리즈를 게시하고
#     모든 PC가 업데이트된다.
on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:
    inputs:
      channel:
        description: '배포 채널 (stable = 모든 PC에 정식 배포, test = 테스트 채널만)'
        type: choice
        options:
          - stable
          - test
        default: stable

concurrency:
  group: release-${{ github.ref }}-${{ github.event.inputs.channel || 'push' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows 빌드 & 자동 릴리즈
    runs-on: windows-latest

    steps:
      - name: 코드 체크아웃 (전체 히스토리)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 배포 채널 결정
        id: ch
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CH="${{ github.event.inputs.channel }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            CH=stable
          else
            CH=test
          fi
          echo "channel=$CH" >> $GITHUB_OUTPUT
          echo "배포 채널: $CH"

      - name: 자동 버전 계산 (커밋 수 기반)
        id: version
        shell: bash
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "version=1.0.$COUNT" >> $GITHUB_OUTPUT
          echo "tag=v1.0.$COUNT" >> $GITHUB_OUTPUT

      - name: package.json 버전 업데이트
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            p.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 패키지 설치
        run: npm ci

      - name: 프론트엔드 빌드 (Vite)
        run: npm run build

      - name: 엑셀 내보내기 번들 빌드 (exceljs → 단일 cjs)
        run: npm run build:xlsx

      - name: 앱 디렉토리 빌드 (ASAR 추출용)
        run: npx electron-builder --win --dir --publish=never

      - name: ASAR 패치 파일 준비
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const asarSrc = 'release/win-unpacked/resources/app.asar';
            if (!fs.existsSync(asarSrc)) {
              console.error('app.asar not found:', asarSrc);
              console.error('release/ contents:', fs.readdirSync('release').join(', '));
              process.exit(1);
            }
            const asar = fs.readFileSync(asarSrc);
            const sha256 = crypto.createHash('sha256').update(asar).digest('hex');
            fs.copyFileSync(asarSrc, 'app-patch.asar');
            fs.writeFileSync('app-meta.json', JSON.stringify({
              version: '${{ steps.version.outputs.version }}',
              sha256
            }));
            console.log('app.asar size:', (asar.length / 1024 / 1024).toFixed(1) + 'MB');
            console.log('sha256:', sha256);
          "

      - name: GitHub Release 초안 미리 생성
        if: steps.ch.outputs.channel == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --title "환경 모니터링 ${{ steps.version.outputs.tag }}" \
            --notes "빌드 중..." \
            --repo "${{ github.repository }}" || true

      - name: Windows 설치파일 빌드 & GitHub Release 업로드
        if: steps.ch.outputs.channel == 'stable'
        run: npx electron-builder --win --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ASAR 패치 파일 릴리즈에 업로드
        if: steps.ch.outputs.channel == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            app-patch.asar \
            app-meta.json \
            --clobber \
            --repo "${{ github.repository }}"

      - name: 릴리즈 게시 (draft → published)
        if: steps.ch.outputs.channel == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.version.outputs.tag }}" --draft=false --repo "${{ github.repository }}" || true

      - name: 릴리즈 설명 업데이트
        if: steps.ch.outputs.channel == 'stable'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEP_TAG: ${{ steps.version.outputs.tag }}
          STEP_VERSION: ${{ steps.version.outputs.version }}
          STEP_BRANCH: ${{ github.ref_name }}
          STEP_SHA: ${{ github.sha }}
          STEP_COMMIT: ${{ github.event.head_commit.message }}
        run: |
          # Use node to build the body — commit message may contain shell-special chars
          node -e "
            const fs = require('fs');
            const tag = process.env.STEP_TAG;
            const ver = process.env.STEP_VERSION;
            const branch = process.env.STEP_BRANCH;
            const sha = process.env.STEP_SHA;
            const msg = (process.env.STEP_COMMIT || '').trim();
            const body = [
              '## 환경 모니터링 ' + tag,
              '',
              '- **버전**: ' + ver,
              '- **브랜치**: ' + branch,
              '- **커밋**: ' + sha,
              '',
              '### 변경 내용',
              msg,
              '',
              '---',
              '',
              '### 설치 방법',
              '\`em-setup-' + ver + '.exe\` 다운로드 후 실행',
              '',
              '> 이미 설치된 경우 앱 실행 시 자동으로 업데이트 알림이 표시됩니다.',
            ].join('\n');
            fs.writeFileSync('release-notes.md', body);
          "
          gh release edit "$STEP_TAG" \
            --title "환경 모니터링 $STEP_TAG" \
            --notes-file release-notes.md \
            --repo "${{ github.repository }}" || true

      # ── 테스트 채널 ──────────────────────────────────────────────
      - name: (테스트) Windows 설치파일 빌드
        if: steps.ch.outputs.channel == 'test'
        run: npx electron-builder --win --publish=never

      - name: (테스트) 'test' 프리릴리즈에 덮어 올리기
        if: steps.ch.outputs.channel == 'test'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEP_VERSION: ${{ steps.version.outputs.version }}
          STEP_BRANCH: ${{ github.ref_name }}
          STEP_SHA: ${{ github.sha }}
          STEP_COMMIT: ${{ github.event.head_commit.message }}
        run: |
          REPO="${{ github.repository }}"
          # 처음이면 프리릴리즈로 만든다(프리릴리즈는 'latest'가 되지 않아 정식 업데이트에 영향 없음)
          gh release view test --repo "$REPO" >/dev/null 2>&1 || \
            gh release create test --prerelease --title "테스트 버전" --notes "테스트 채널" --target "$STEP_SHA" --repo "$REPO"
          # 지난 테스트 설치파일은 지우고 이번 것만 남긴다
          for a in $(gh release view test --repo "$REPO" --json assets -q '.assets[].name' | grep '^em-setup-' || true); do
            gh release delete-asset test "$a" -y --repo "$REPO" || true
          done
          gh release upload test app-patch.asar app-meta.json release/em-setup-*.exe --clobber --repo "$REPO"
          node -e "
            const fs = require('fs');
            const body = [
              '## 테스트 버전 ' + process.env.STEP_VERSION,
              '',
              '- 브랜치: ' + process.env.STEP_BRANCH,
              '- 커밋: ' + process.env.STEP_SHA,
              '',
              '### 변경 내용',
              (process.env.STEP_COMMIT || '').trim(),
              '',
              '> 앱에서 \'테스트 버전 받기\'를 켠 PC만 이 버전으로 업데이트됩니다. 정식 배포는 Actions에서 channel=stable로 실행하거나 main에 push할 때입니다.',
            ].join('\n');
            fs.writeFileSync('test-notes.md', body);
          "
          gh release edit test --prerelease --title "테스트 버전 v$STEP_VERSION" --notes-file test-notes.md --repo "$REPO"
