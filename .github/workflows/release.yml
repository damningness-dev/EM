name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '릴리즈 버전 (예: v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows 빌드 (.exe)
    runs-on: windows-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 패키지 설치
        run: npm ci

      - name: 프론트엔드 빌드 (Vite)
        run: npm run build

      - name: Windows 설치파일 빌드
        run: npx electron-builder --win --publish=never

      - name: 릴리즈 태그 결정
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "name=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: GitHub Release 생성 및 업로드
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: 환경 모니터링 ${{ steps.tag.outputs.name }}
          body: |
            ## 환경 모니터링 관리 시스템 ${{ steps.tag.outputs.name }}

            ### 설치 방법
            1. 아래 **`환경 모니터링 Setup x.x.x.exe`** 파일을 클릭하여 다운로드
            2. 실행 후 설치 (Windows 보안 경고 시 → "추가 정보" → "실행")
            3. 바탕화면 단축아이콘으로 실행

            ### 데이터 저장 위치
            `C:\Users\{사용자}\AppData\Roaming\환경 모니터링\em-data.json`

            > 데이터 백업 시 위 파일을 복사하세요.
          draft: false
          prerelease: false
          files: |
            release/**/*.exe
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
