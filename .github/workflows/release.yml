name: Auto Build & Release

on:
  push:
    branches:
      - main
      - 'claude/**'   # Claude가 푸시하는 브랜치도 포함

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows 빌드 & 자동 릴리즈
    runs-on: windows-latest

    steps:
      - name: 코드 체크아웃 (전체 히스토리)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 커밋 수 계산에 필요

      - name: 자동 버전 계산 (커밋 수 기반)
        id: version
        shell: bash
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "version=1.0.$COUNT" >> $GITHUB_OUTPUT
          echo "tag=v1.0.$COUNT" >> $GITHUB_OUTPUT
          echo "패치 버전: 1.0.$COUNT"

      - name: package.json 버전 업데이트
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            p.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 패키지 설치
        run: npm ci

      - name: 프론트엔드 빌드 (Vite)
        run: npm run build

      - name: Windows 설치파일 빌드 & GitHub Release 업로드
        run: npx electron-builder --win --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 릴리즈 설명 업데이트
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "환경 모니터링 ${{ steps.version.outputs.tag }}"
          body: |
            ## 자동 빌드 패치

            - **버전**: ${{ steps.version.outputs.version }}
            - **브랜치**: `${{ github.ref_name }}`
            - **커밋**: ${{ github.sha }}
            - **시각**: ${{ github.event.head_commit.timestamp }}

            ### 변경 내용
            ${{ github.event.head_commit.message }}

            ---

            ### 설치 방법
            `환경 모니터링 Setup ${{ steps.version.outputs.version }}.exe` 다운로드 후 실행

            > 이미 설치된 경우 앱 실행 시 자동으로 업데이트 알림이 표시됩니다.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
