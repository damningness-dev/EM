name: Auto Build & Release

on:
  push:
    branches:
      - main
      - 'claude/**'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows 빌드 & 자동 릴리즈
    runs-on: windows-latest

    steps:
      - name: 코드 체크아웃 (전체 히스토리)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 자동 버전 계산 (커밋 수 기반)
        id: version
        shell: bash
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "version=1.0.$COUNT" >> $GITHUB_OUTPUT
          echo "tag=v1.0.$COUNT" >> $GITHUB_OUTPUT

      - name: package.json 버전 업데이트
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            p.version = '${{ steps.version.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          "

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 패키지 설치
        run: npm ci

      - name: 프론트엔드 빌드 (Vite)
        run: npm run build

      - name: 엑셀 내보내기 번들 빌드 (exceljs → 단일 cjs)
        run: npm run build:xlsx

      - name: 앱 디렉토리 빌드 (ASAR 추출용)
        run: npx electron-builder --win --dir --publish=never

      - name: ASAR 패치 파일 준비
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const asarSrc = 'release/win-unpacked/resources/app.asar';
            if (!fs.existsSync(asarSrc)) {
              console.error('app.asar not found:', asarSrc);
              console.error('release/ contents:', fs.readdirSync('release').join(', '));
              process.exit(1);
            }
            const asar = fs.readFileSync(asarSrc);
            const sha256 = crypto.createHash('sha256').update(asar).digest('hex');
            fs.copyFileSync(asarSrc, 'app-patch.asar');
            fs.writeFileSync('app-meta.json', JSON.stringify({
              version: '${{ steps.version.outputs.version }}',
              sha256
            }));
            console.log('app.asar size:', (asar.length / 1024 / 1024).toFixed(1) + 'MB');
            console.log('sha256:', sha256);
          "

      - name: GitHub Release 초안 미리 생성
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --title "환경 모니터링 ${{ steps.version.outputs.tag }}" \
            --notes "빌드 중..." \
            --repo "${{ github.repository }}" || true

      - name: Windows 설치파일 빌드 & GitHub Release 업로드
        run: npx electron-builder --win --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ASAR 패치 파일 릴리즈에 업로드
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.version.outputs.tag }}" \
            app-patch.asar \
            app-meta.json \
            --clobber \
            --repo "${{ github.repository }}"

      - name: 릴리즈 게시 (draft → published)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.version.outputs.tag }}" --draft=false --repo "${{ github.repository }}" || true

      - name: 릴리즈 설명 업데이트
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEP_TAG: ${{ steps.version.outputs.tag }}
          STEP_VERSION: ${{ steps.version.outputs.version }}
          STEP_BRANCH: ${{ github.ref_name }}
          STEP_SHA: ${{ github.sha }}
          STEP_COMMIT: ${{ github.event.head_commit.message }}
        run: |
          # Use node to build the body — commit message may contain shell-special chars
          node -e "
            const fs = require('fs');
            const tag = process.env.STEP_TAG;
            const ver = process.env.STEP_VERSION;
            const branch = process.env.STEP_BRANCH;
            const sha = process.env.STEP_SHA;
            const msg = (process.env.STEP_COMMIT || '').trim();
            const body = [
              '## 환경 모니터링 ' + tag,
              '',
              '- **버전**: ' + ver,
              '- **브랜치**: ' + branch,
              '- **커밋**: ' + sha,
              '',
              '### 변경 내용',
              msg,
              '',
              '---',
              '',
              '### 설치 방법',
              '\`em-setup-' + ver + '.exe\` 다운로드 후 실행',
              '',
              '> 이미 설치된 경우 앱 실행 시 자동으로 업데이트 알림이 표시됩니다.',
            ].join('\n');
            fs.writeFileSync('release-notes.md', body);
          "
          gh release edit "$STEP_TAG" \
            --title "환경 모니터링 $STEP_TAG" \
            --notes-file release-notes.md \
            --repo "${{ github.repository }}" || true
